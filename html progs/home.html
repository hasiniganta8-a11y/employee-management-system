<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Employee Management System</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ---------------- LIGHT THEME ---------------- */

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #222;
            transition: 0.3s;
        }


        /* ---------------- NAVIGATION BAR ---------------- */

        .navbar {
            background-color: #222;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            font-size: 28px;
        }

        .navbar-right {
            display: flex;
            align-items: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 30px;
            font-size: 18px;
        }

        .navbar a:hover {
            color: #ddd;
        }


        /* ---------------- THEME BUTTON ---------------- */

        #themeToggle {
            margin-left: 30px;
            padding: 9px 15px;
            border: none;
            border-radius: 5px;
            background-color: white;
            color: #222;
            cursor: pointer;
            font-size: 15px;
        }

        #themeToggle:hover {
            background-color: #ddd;
        }


        /* ---------------- MAIN SECTION ---------------- */

        .container {
            text-align: center;
            padding-top: 80px;
        }

        .container h1 {
            font-size: 45px;
            margin-bottom: 25px;
        }

        .container p {
            font-size: 20px;
            margin-bottom: 40px;
        }


        /* ---------------- BUTTONS ---------------- */

        .buttons {
            display: flex;
            justify-content: center;
            gap: 25px;
        }

        .btn {
            display: inline-block;
            padding: 15px 30px;
            background-color: #333;
            color: white;
            text-decoration: none;
            font-size: 20px;
            border-radius: 6px;
        }

        .btn:hover {
            background-color: #555;
        }


        /* ---------------- DARK THEME ---------------- */

        body.dark-mode {
            background-color: #121212;
            color: white;
        }

        body.dark-mode .navbar {
            background-color: #000;
        }

        body.dark-mode .btn {
            background-color: white;
            color: black;
        }

        body.dark-mode .btn:hover {
            background-color: #ddd;
        }

        body.dark-mode #themeToggle {
            background-color: #333;
            color: white;
            border: 1px solid #777;
        }

    </style>

</head>


<body>


    <!-- Navigation bar -->

    <div class="navbar">

        <h2>Employee Management System</h2>

        <div class="navbar-right">

            <a href="/">Home</a>

            <a href="/register">Register</a>

            <a href="/login">Login</a>

            <button id="themeToggle" onclick="toggleTheme()">
                🌙 Dark Mode
            </button>

        </div>

    </div>


    <!-- Homepage content -->

    <div class="container">

        <h1>
            Welcome to Employee Management System
        </h1>

        <p>
            Manage employee information easily using this system.
        </p>

        <div class="buttons">

            <a href="/employees" class="btn">
                View Employees
            </a>

            <a href="/addemployee" class="btn">
                Add Employee
            </a>

        </div>

    </div>


    <!-- Dark/Light Mode JavaScript -->

    <script>

    // Load saved theme when page opens
    window.onload = function() {

        const savedTheme = getCookie("theme");

        if (savedTheme === "dark") {

            document.body.classList.add("dark-mode");

            document.getElementById("themeToggle").innerHTML =
                "☀️ Light Mode";

        }

    };


    // Change theme
    function toggleTheme() {

        document.body.classList.toggle("dark-mode");

        const button =
            document.getElementById("themeToggle");


        if (document.body.classList.contains("dark-mode")) {

            button.innerHTML = "☀️ Light Mode";

            // Store dark theme in cookie
            document.cookie =
                "theme=dark; max-age=31536000; path=/";

        } else {

            button.innerHTML = "🌙 Dark Mode";

            // Store light theme in cookie
            document.cookie =
                "theme=light; max-age=31536000; path=/";

        }

    }


    // Get cookie value
    function getCookie(name) {

        let cookies = document.cookie.split(";");

        for (let cookie of cookies) {

            cookie = cookie.trim();

            if (cookie.startsWith(name + "=")) {

                return cookie.substring(name.length + 1);

            }

        }

        return null;

    }

</script>


</body>

</html>
