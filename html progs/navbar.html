<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fc;
            color: black;
        }

        /* Navbar */
        .navbar {
            background-color: #302b63;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Logo */
        .logo {
            color: #ffffff;
            font-size: 22px;
            font-weight: bold;
        }

        /* Navigation links */
        .nav-links {
            display: flex;
            align-items: center;
            list-style: none;
            gap: 20px;
        }

        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            padding: 8px 12px;
            border-radius: 5px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #a8edea;
        }

        /* Login button */
        .login-btn {
            border: 1px solid #a8edea;
            padding: 8px 15px;
            border-radius: 5px;
        }

        .login-btn:hover {
            background-color: #a8edea;
            color: #302b63 !important;
        }

        /* Register button */
        .register-btn {
            background-color: #8e44ad;
            padding: 8px 15px;
            border-radius: 5px;
        }

        .register-btn:hover {
            background-color: #732d91;
            color: white !important;
        }

        /* Content */
        .content {
            padding: 50px;
            text-align: center;
        }

        .content h1 {
            color: #302b63;
            margin-bottom: 15px;
        }

        .content p {
            color: #555;
            font-size: 18px;
        }

        /* Theme */
        .theme-toggle {
            display: flex;
            gap: 10px;
        }

        .theme-toggle a {
            color: white;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
        }

        /* Dark Theme */
        body.dark {
            background-color: #222;
            color: white;
        }

        body.dark .content h1 {
            color: white;
        }

        body.dark .content p {
            color: white;
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            Employee Management System
        </div>

        <ul class="nav-links">

            <li>
                <a href="/home">Home</a>
            </li>

            <li>
                <a href="/employees">Employees</a>
            </li>

            <li>
                <a href="/addemployee">Add Employee</a>
            </li>

            <li>
                <a href="/search">Search</a>
            </li>

            <li>
                <a href="/login">Login</a>
            </li>

            <li>
                <a href="/register">Register</a>
            </li>

            <li>
                <div class="theme-toggle">
                    <a href="#" onclick="lightTheme()">☀️ Light</a>
                    <a href="#" onclick="darkTheme()">🌙 Dark</a>
                </div>
            </li>

        </ul>

    </nav>

    <div class="content">

        <h1>Welcome to employee management system</h1>

        <p>Manage your employes easily</p>

    </div>

    <script>
    function lightTheme() {
        document.body.classList.remove("dark");
        localStorage.setItem("theme", "light");
    }

    function darkTheme() {
        document.body.classList.add("dark");
        localStorage.setItem("theme", "dark");
    }
</script>

</body>

</html>
