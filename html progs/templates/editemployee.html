<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Employee</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
        }

        .container {
            width: 500px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            font-size: 15px;
        }

        select {
            background-color: white;
            cursor: pointer;
        }

        textarea {
            height: 80px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background-color: #333;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
            border-radius: 4px;
        }

        button:hover {
            background-color: #555;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #333;
        }

        .back:hover {
            text-decoration: underline;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Edit Employee</h1>

    <form action="/update/{{ employee['id'] }}" method="POST">

        <!-- FULL NAME -->

        <label>Full Name</label>

        <input
            type="text"
            name="fullname"
            value="{{ employee['fullname'] }}"
            required
        >


        <!-- EMAIL -->

        <label>Email</label>

        <input
            type="email"
            name="email"
            value="{{ employee['email'] }}"
            required
        >


    <label>Department</label>

<select name="department" required>

    <option value="" selected>SELECT DEPARTMENT</option>

    <option value="Human Resources">Human Resources</option>

    <option value="Finance">Finance</option>

    <option value="Marketing">Marketing</option>

    <option value="Sales">Sales</option>

    <option value="IT">IT</option>

    <option value="Software Development">Software Development</option>

    <option value="Operations">Operations</option>

    <option value="Customer Service">Customer Service</option>

    <option value="Administration">Administration</option>

    <option value="Management">Management</option>

</select>


        <!-- PHONE -->

        <label>Phone</label>

        <input
            type="text"
            name="phone"
            value="{{ employee['phone'] }}"
            required
        >


        <!-- SALARY -->

        <label>Salary</label>

        <input
            type="number"
            name="salary"
            value="{{ employee['salary'] }}"
            required
        >


        <!-- JOINING DATE -->

        <label>Joining Date</label>

        <input
            type="date"
            name="joiningdate"
            value="{{ employee['joiningdate'] }}"
            required
        >


        <!-- ADDRESS -->

        <label>Address</label>

        <textarea
            name="address"
            required
        >{{ employee['address'] }}</textarea>


        <!-- UPDATE BUTTON -->

        <button type="submit">
            Update Employee
        </button>

    </form>


    <!-- BACK BUTTON -->

    <a class="back" href="/employees">
        ← Back to Employees
    </a>

</div>

</body>

</html>
